<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Reminder Calendar</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22My%20Reminder%20Calendar%22,%22short_name%22:%22Patro%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23fdfaf5%22,%22theme_color%22:%22%237a1b2e%22}">
<style>
  :root{
    --bg:#fdfaf5; --card:#ffffff; --ink:#241417; --muted:#7c6f72;
    --line:#e8dfe0; --accent:#7a1b2e; --accent-ink:#ffffff;
    --tithi:#2f7d6a; --holiday:#d1453b; --sat:#5c6b78; --remdot:#2e8b57;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1416; --card:#241a1c; --ink:#f3e9ea; --muted:#a58d90;
      --line:#3a2a2d; --accent:#e0616f; --accent-ink:#1b1416; --tithi:#5fd9c4; --holiday:#ff6b6b; --sat:#93a5b3; --remdot:#6fcf97;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1416; --card:#241a1c; --ink:#f3e9ea; --muted:#a58d90;
    --line:#3a2a2d; --accent:#e0616f; --accent-ink:#1b1416; --tithi:#5fd9c4; --holiday:#ff6b6b; --sat:#93a5b3; --remdot:#6fcf97;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%; font-size:19px;}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  }
  header{
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;
    background:var(--accent); color:var(--accent-ink);
    display:flex; align-items:center; justify-content:space-between;
  }
  header h1{margin:0; font-size:1.3rem; font-weight:700;}
  header .sub{font-size:.85rem; opacity:.85;}
  main{max-width:520px; margin:0 auto; padding:14px 14px 90px;}
  @media (min-width:860px){
    html{font-size:21px;}
    body{display:flex; flex-direction:column; min-height:100vh;}
    main{
      max-width:1500px; width:92%; margin:0 auto; padding:36px 24px 60px; flex:1;
      display:grid; grid-template-columns:1.3fr 1fr; gap:32px; align-items:start;
    }
    .col-left, .col-right{display:flex; flex-direction:column; gap:24px;}
    header{padding:22px 40px;}
    header h1{font-size:2rem;} header .sub{font-size:1.15rem;}
    .theme-toggle{font-size:.95rem; padding:8px 14px;}
    .card{padding:28px; border-radius:18px;}
    .nav .title{font-size:1.6rem;}
    .nav button{width:44px; height:44px; font-size:1.4rem;}
    .weekdays div{font-size:.95rem;}
    .grid{gap:8px; grid-auto-rows:minmax(108px,auto);}
    .grid div.day{font-size:1.35rem; border-radius:12px; padding:8px 9px;}
    .grid div.day .ev{font-size:.82rem; -webkit-line-clamp:3;}
    .grid div.day .dot{width:6px; height:6px; top:6px; right:6px;}
    .detail h3{font-size:1.35rem;} .detail p{font-size:1.1rem;}
    .btn{padding:13px 22px; font-size:1.1rem; border-radius:11px;}
    label{font-size:.95rem;} input,select{font-size:1.1rem; padding:13px;}
    .rem-item .t{font-size:1.1rem;} .rem-item .d{font-size:.95rem;}
    .note{font-size:.88rem;}
  }
  @media (min-width:1300px){
    html{font-size:22.5px;}
    main{max-width:1700px;}
    .grid{grid-auto-rows:minmax(128px,auto);}
    .grid div.day{font-size:1.5rem;}
    .grid div.day .ev{font-size:.92rem;}
  }
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px;}
  .nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .nav button{background:none; border:1px solid var(--line); color:var(--ink); border-radius:8px; width:38px; height:38px; font-size:1.2rem;}
  .nav .title{font-weight:700; font-size:1.2rem;}
  .weekdays,.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center;}
  .weekdays div{font-size:.82rem; color:var(--muted); padding-bottom:4px;}
  .grid{grid-auto-rows:minmax(82px,auto);}
  .grid div.day{
    position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start;
    text-align:left; padding:4px 5px; gap:2px;
    border-radius:8px; font-size:.95rem; cursor:pointer; border:1px solid transparent; overflow:hidden;
  }
  .grid div.day .daynum{font-weight:700;}
  .grid div.day .ev{
    font-size:.68rem; line-height:1.2; color:inherit; opacity:.92; font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .grid div.day.holiday{color:var(--holiday); font-weight:700;}
  .grid div.day.festival{color:var(--tithi); font-weight:700;}
  .grid div.day.sat{color:var(--holiday);}
  .grid div.day.today{border-color:var(--accent);}
  .grid div.day.selected{background:var(--accent); color:var(--accent-ink);}
  .grid div.day .dot{position:absolute; top:4px; right:4px; width:5px; height:5px; border-radius:50%; background:var(--remdot);}
  .grid div.empty{visibility:hidden;}
  .detail h3{margin:0 0 4px; font-size:1.15rem;}
  .detail p{margin:0 0 8px; font-size:.95rem; color:var(--muted); line-height:1.4;}
  .btn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:9px; padding:10px 16px; font-size:1rem; font-weight:600;}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--ink);}
  input,select{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--bg); color:var(--ink); font-size:1rem; margin-bottom:8px;}
  label{font-size:.82rem; color:var(--muted);}
  .rem-item{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); gap:8px;}
  .rem-item:last-child{border-bottom:none;}
  .rem-item .t{font-size:1rem;}
  .rem-item .d{font-size:.82rem; color:var(--muted);}
  .rem-item button{background:none; border:none; color:var(--holiday); font-size:.88rem;}
  .empty-state{text-align:center; color:var(--muted); font-size:.92rem; padding:16px 0;}
  .note{font-size:.8rem; color:var(--muted); margin-top:6px; line-height:1.5;}
  .theme-toggle{background:none; border:1px solid rgba(255,255,255,.5); color:var(--accent-ink); border-radius:8px; padding:6px 11px; font-size:.82rem;}
</style>
</head>
<body>
<header>
  <div>
    <h1>My Reminder Calendar</h1>
    <div class="sub">विक्रम सम्वत् २०८३</div>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">☀︎/☾</button>
</header>

<main>
  <div class="col-left">
  <div class="card">
    <div class="nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="title" id="monthTitle"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <button class="btn ghost" style="flex:1;" onclick="goToday()">आज</button>
      <button class="btn ghost" style="flex:1;" onclick="openJump()">मिति खोज्नुहोस्</button>
    </div>
    <div class="weekdays">
      <div>आइत</div><div>सोम</div><div>मंगल</div><div>बुध</div><div>बिही</div><div>शुक्र</div><div>शनि</div>
    </div>
    <div class="grid" id="grid"></div>
    <div style="display:flex; gap:14px; margin:10px 0; font-size:.72rem; color:var(--muted);">
      <span><span style="color:var(--holiday); font-weight:700;">●</span> सार्वजनिक बिदा</span>
      <span><span style="color:var(--tithi); font-weight:700;">●</span> पर्व/तिथि</span>
      <span><span style="color:var(--remdot); font-weight:700;">●</span> रिमाइन्डर</span>
    </div>
  </div>
  </div>

  <div class="col-right">
  <div class="card" id="jumpCard" style="display:none;">
    <label>महिना</label>
    <select id="jumpMonth"></select>
    <label>गते</label>
    <select id="jumpDay"></select>
    <div style="display:flex; gap:8px;">
      <button class="btn" onclick="doJump()">जानुहोस्</button>
      <button class="btn ghost" onclick="closeJump()">रद्द</button>
    </div>
  </div>

  <div class="card detail" id="detailCard" style="display:none;">
    <h3 id="detailTitle"></h3>
    <p id="detailFestival"></p>
    <button class="btn" onclick="openAddReminder()">+ रिमाइन्डर थप्नुहोस्</button>
  </div>

  <div class="card" id="addCard" style="display:none;">
    <label>शीर्षक</label>
    <input id="remTitle" placeholder="जस्तै: बुबाको जन्मदिन">
    <label>समय</label>
    <input id="remTime" type="time" value="09:00">
    <div style="display:flex; gap:8px;">
      <button class="btn" onclick="saveReminder()">सुरक्षित गर्नुहोस्</button>
      <button class="btn ghost" onclick="closeAddReminder()">रद्द</button>
    </div>
  </div>

  <div class="card">
    <h3 id="remHeading" style="margin:0 0 8px; font-size:.95rem;">आगामी रिमाइन्डरहरू</h3>
    <div id="remList"></div>
  </div>
  </div>
</main>

<script>

const NEPNUM=['०','१','२','३','४','५','६','७','८','९'];
function toNep(n){return String(n).split('').map(c=>NEPNUM[c]||c).join('');}
function findHoliday(m,d){const h=HOLIDAYS.find(x=>x[0]===m&&x[1]===d); return h?{name:h[2], pub:!!h[3]}:null;}
function offsetToBs(days){let m=0; while(days>=MDAYS[m]){days-=MDAYS[m]; m++;} return {month:m+1, day:days+1};}
function todayBs(){const diff=Math.floor((new Date().setHours(0,0,0,0)-ANCHOR_AD.getTime())/86400000); if(diff<0||diff>364) return {month:1,day:1}; return offsetToBs(diff);}

let view=todayBs();
let selected=null;

function render(){
  document.getElementById('monthTitle').textContent=MONTHS[view.month-1]+' २०८३';
  const grid=document.getElementById('grid'); grid.innerHTML='';
  for(let i=0;i<MSTART[view.month-1];i++){const e=document.createElement('div'); e.className='empty'; grid.appendChild(e);}
  const tBs=todayBs();
  for(let d=1; d<=MDAYS[view.month-1]; d++){
    const cell=document.createElement('div'); cell.className='day';
    const wd=(MSTART[view.month-1]+d-1)%7;
    const hol=findHoliday(view.month,d);
    if(wd===6 || wd===0) cell.classList.add('sat');
    if(hol && hol.pub) cell.classList.add('holiday');
    else if(hol) cell.classList.add('festival');
    if(view.month===tBs.month && d===tBs.day) cell.classList.add('today');
    if(selected && selected.month===view.month && selected.day===d) cell.classList.add('selected');
    const num=document.createElement('div'); num.className='daynum'; num.textContent=toNep(d); cell.appendChild(num);
    if(hol){const ev=document.createElement('div'); ev.className='ev'; ev.textContent=hol.name; cell.appendChild(ev);}
    if(hasReminder(view.month,d)){const dot=document.createElement('div'); dot.className='dot'; cell.appendChild(dot);}
    cell.onclick=()=>selectDay(view.month,d);
    grid.appendChild(cell);
  }
}
function selectDay(m,d){
  selected={month:m,day:d}; render();
  const hol=findHoliday(m,d);
  document.getElementById('detailCard').style.display='block';
  document.getElementById('detailTitle').textContent=MONTHS[m-1]+' '+toNep(d)+' गते';
  document.getElementById('detailFestival').textContent=hol?((hol.pub?'🔴 सार्वजनिक बिदा: ':'🟡 पर्व/तिथि: ')+hol.name):'कुनै विशेष पर्व/बिदा छैन।';
  closeAddReminder();
  renderReminders();
}
function changeMonth(delta){
  let m=view.month+delta;
  if(m<1) m=12; if(m>12) m=1;
  view={month:m,day:1}; render(); renderReminders();
}
function goToday(){
  view=todayBs(); selectDay(view.month, view.day);
}
function openJump(){
  const ms=document.getElementById('jumpMonth'); const ds=document.getElementById('jumpDay');
  ms.innerHTML=MONTHS.map((m,i)=>`<option value="${i+1}" ${i+1===view.month?'selected':''}>${m}</option>`).join('');
  fillJumpDays();
  ms.onchange=fillJumpDays;
  document.getElementById('jumpCard').style.display='block';
}
function fillJumpDays(){
  const m=parseInt(document.getElementById('jumpMonth').value);
  const ds=document.getElementById('jumpDay'); const n=MDAYS[m-1];
  let opts=''; for(let i=1;i<=n;i++) opts+=`<option value="${i}">${toNep(i)}</option>`;
  ds.innerHTML=opts;
}
function closeJump(){document.getElementById('jumpCard').style.display='none';}
function doJump(){
  const m=parseInt(document.getElementById('jumpMonth').value);
  const d=parseInt(document.getElementById('jumpDay').value);
  view={month:m,day:1}; render(); selectDay(m,d); closeJump();
}
function openAddReminder(){document.getElementById('addCard').style.display='block'; if('Notification' in window && Notification.permission==='default') Notification.requestPermission();}
function closeAddReminder(){document.getElementById('addCard').style.display='none'; document.getElementById('remTitle').value=''; }
function loadRem(){try{return JSON.parse(localStorage.getItem('reminders')||'[]');}catch(e){return [];}}
function saveRem(list){try{localStorage.setItem('reminders', JSON.stringify(list));}catch(e){}}
function hasReminder(m,d){return loadRem().some(r=>r.month===m&&r.day===d);}
function saveReminder(){
  const title=document.getElementById('remTitle').value.trim();
  const time=document.getElementById('remTime').value||'09:00';
  if(!title || !selected) return;
  const list=loadRem();
  list.push({id:Date.now(), month:selected.month, day:selected.day, title, time, fired:false});
  saveRem(list); closeAddReminder(); render(); renderReminders();
}
function deleteReminder(id){saveRem(loadRem().filter(r=>r.id!==id)); render(); renderReminders();}
function renderReminders(){
  const list=loadRem().filter(r=>r.month===view.month).sort((a,b)=>a.day-b.day);
  const box=document.getElementById('remList');
  const h=document.getElementById('remHeading'); if(h) h.textContent='आगामी रिमाइन्डरहरू ('+MONTHS[view.month-1]+')';
  if(list.length===0){box.innerHTML='<div class="empty-state">यो महिना कुनै रिमाइन्डर थपिएको छैन।</div>'; return;}
  box.innerHTML=list.map(r=>`
    <div class="rem-item">
      <div>
        <div class="t">${r.title}</div>
        <div class="d">${MONTHS[r.month-1]} ${toNep(r.day)} गते · ${r.time}</div>
      </div>
      <button onclick="deleteReminder(${r.id})">हटाउ</button>
    </div>`).join('');
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur==='dark'?'light':'dark');
}
setInterval(()=>{
  const list=loadRem(); const tBs=todayBs(); const now=new Date();
  const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  let changed=false;
  list.forEach(r=>{
    if(!r.fired && r.month===tBs.month && r.day===tBs.day && r.time<=hhmm){
      r.fired=true; changed=true;
      if('Notification' in window && Notification.permission==='granted'){
        new Notification('रिमाइन्डर', {body:r.title});
      }
    }
  });
  if(changed) saveRem(list);
}, 30000);

render(); renderReminders();
</script>
